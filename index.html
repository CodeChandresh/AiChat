<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- DOMPurify (HTML sanitization) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

    <!-- Marked.js (Markdown parsing) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@10.0.0/marked.min.js"></script>

    <!-- Highlight.js (Code Syntax Highlighting) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100 h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-md p-4 flex justify-between items-center z-10 transition-colors duration-300">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-robot text-blue-500 text-2xl"></i>
            <h1 class="text-xl font-semibold">AI Assistant</h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="clearChatBtn" class="text-gray-500 hover:text-red-500 transition-colors" title="Clear Chat">
                <i class="fa-solid fa-trash-can text-lg"></i>
            </button>
            <button id="themeToggleBtn" class="text-gray-500 hover:text-yellow-500 transition-colors dark:hover:text-yellow-300" title="Toggle Theme">
                <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Chat Container -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-6 w-full max-w-4xl mx-auto">
        <!-- Messages will be appended here -->

        <!-- Welcome Message -->
        <div class="flex gap-4 message-bot opacity-0 transition-opacity duration-500" id="welcomeMessage">
            <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center shrink-0 mt-1">
                <i class="fa-solid fa-robot text-white text-sm"></i>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl rounded-tl-none shadow-sm max-w-[80%] prose dark:prose-invert">
                <p>Hello! I'm your AI assistant. How can I help you today?</p>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <div class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-4 transition-colors duration-300">
        <div class="max-w-4xl mx-auto relative flex items-end gap-2">
            <input type="file" id="fileUpload" accept=".txt,.md" class="hidden">
            <button id="uploadBtn" class="w-10 h-10 bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 rounded-xl flex items-center justify-center hover:bg-gray-300 dark:hover:bg-gray-500 transition-colors shrink-0" title="Upload document for RAG">
                <i class="fa-solid fa-paperclip"></i>
            </button>
            <textarea
                id="userInput"
                rows="1"
                class="w-full bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100 rounded-2xl pl-4 pr-12 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none max-h-32 transition-colors duration-300"
                placeholder="Message AI Assistant..."
            ></textarea>
            <button id="sendBtn" class="absolute right-2 bottom-2 w-10 h-10 bg-blue-500 text-white rounded-xl flex items-center justify-center hover:bg-blue-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
        <p class="text-center text-xs text-gray-500 mt-2">Press Enter to send, Shift + Enter for new line</p>
    </div>

    <!-- Custom Script -->
    <script src="script.js"></script>
</body>
</html>
